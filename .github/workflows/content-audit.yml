name: Manual source-age audit
# No schedule is enabled. This does not fetch or automatically refresh merchant data.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-age:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - run: npm run audit:content
